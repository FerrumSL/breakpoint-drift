name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2  # R CMD check reads NEWS.md with pandoc

      - uses: r-lib/actions/setup-renv@v2

      - name: R CMD check (includes the tests with a known injected artefact)
        run: |
          R CMD build .
          R CMD check --no-manual --as-cran breakpointdrift_*.tar.gz
          grep -q "Status: OK" breakpointdrift.Rcheck/00check.log
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false

      # scripts/simulation.R is not rerun here: it takes about 50 minutes on 16 cores. Each of
      # its cells has its own seed, so a local rerun reproduces results/simulation.csv.
      - name: NCBI, NARMS and WHONET runs must reproduce the committed results
        run: |
          Rscript scripts/ncbi.R
          Rscript scripts/narms.R
          Rscript scripts/whonet_audit.R
          Rscript scripts/simulation_table.R
          # sessionInfo.txt records the machine, and the figure PDF embeds its creation time
          git status --porcelain results/
          git diff --exit-code -- results/ ':!results/sessionInfo.txt' ':!results/*.pdf'
