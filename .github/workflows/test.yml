name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: R CMD check (includes the tests with a known injected artefact)
        run: |
          R CMD build .
          R CMD check --no-manual --as-cran breakpointdrift_*.tar.gz
          grep -q "Status: OK" breakpointdrift.Rcheck/00check.log
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false

      - name: NCBI and NARMS runs must reproduce the committed results
        run: |
          Rscript scripts/ncbi.R
          Rscript scripts/narms.R
          git status --porcelain results/
          git diff --exit-code results/
